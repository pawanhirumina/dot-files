
# --- prefix ---
# C-a is easier than C-b, like screen/vim
unbind C-b
set -g prefix ` 
bind ` send-prefix

# --- basics ---
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g status-interval 5
set -g set-clipboard on
# add at bottom
set -g allow-passthrough on
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"
set -g escape-time 1
set -g repeat-time 1000

# --- vim mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- panes / windows - vim style ---
# split: | and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# navigate panes with hjkl (no prefix needed with Alt)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl to switch without prefix (super usable)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status on 
set -g status-position top 
set -g status-justify left
set -g status-style "bg=default,fg=black,bright"
set -g status-left-length 100
set -g status-right-length 80
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

# --- dots for workspaces ---
set -g monitor-activity on
set -g monitor-bell on
set -g activity-action none
set -g bell-action any

set -g window-status-separator " "
set -g window-status-format "#[fg=brightblack]●"
set -g window-status-current-format "#[fg=magenta,bold]●"
set -g window-status-activity-style "fg=yellow,bold"
set -g window-status-bell-style "fg=red,bold"



# reload
bind r source-file ~/.tmux.conf \; display "reloaded!"

set -g status on 
set -g status-position top 
set -g status-justify left
set -g status-style "bg=default,fg=black,bright"
set -g status-left-length 100
set -g status-right-length 80


set -g status-left ""
set -g status-right "#[fg=black,bright]#S "


# window list minimal
set -g window-status-format "●"
set -g window-status-current-format "●"

set -g window-status-current-style "#{?window_zoomed_flag, fg=yellow, fg=magenta, nobold}"

set -g window-status-bell-style "fg=red, nobold"
# pane border minimal
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"

# messages
set -g message-style "bg=white fg=black"

# --- quality of life ---
# keep path when splitting
# zoom
bind -n M-z resize-pane -Z
bind z resize-pane -Z

# no confirm kill window
bind & kill-window


